<!doctype html>
<html lang="tr" data-theme="futuristic">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let mode = 'system';
        try {
          mode = localStorage.getItem('futuristic:theme') || 'system';
        } catch {}
        document.documentElement.dataset.theme =
          mode === 'dark' ||
          (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'futuristic-dark'
            : 'futuristic';
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta
      name="description"
      content="AI video üretimi ve yazılım geliştirme üzerine altı araştırmanın sentezi. Mimari, araçlar, maliyetler ve izlenebilir kaynaklarla karar odaklı rapor."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>futuristic — Yapay zekâ araştırma atlası</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
